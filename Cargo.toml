[package]
name = "lessi"
version = "0.2.2"
edition = "2021"
description = "A terminal pager with integrated sixel/kitty graphics support"
authors = ["Rob Lillack <rob@lillack.net>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/roblillack/lessi"
repository = "https://github.com/roblillack/lessi"
documentation = "https://docs.rs/lessi"
# The README's demo.gif is resolved against `repository` on crates.io, so the
# (large) file itself doesn't need to ship in the crate.
exclude = ["demo.gif"]

[package.metadata.release]
pre-release-replacements = [
    # Roll CHANGELOG's [Unreleased] over to the new version and re-seed a fresh
    # [Unreleased] above it (the Keep a Changelog + cargo-release marker idiom).
    # Order matters: the version/date/compare substitutions run first, *then*
    # the markers re-insert the literal "Unreleased"/"ReleaseDate" tokens so the
    # next release finds them again.
    { file = "CHANGELOG.md", search = "Unreleased", replace = "{{version}}" },
    { file = "CHANGELOG.md", search = '\.\.\.HEAD', replace = "...{{tag_name}}", exactly = 1 },
    { file = "CHANGELOG.md", search = "ReleaseDate", replace = "{{date}}" },
    { file = "CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n\n## [Unreleased] - ReleaseDate", exactly = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-url -->", replace = "<!-- next-url -->\n[Unreleased]: https://github.com/roblillack/lessi/compare/{{tag_name}}...HEAD", exactly = 1 },
]

[[bin]]
name = "lessi"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty"] }
unicode-width = "0.2.2"
clap = { version = "4.4", features = ["derive"] }
base64 = "0.22"
flate2 = "1"
png = "0.17"
open = "5"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
insta = "1"
