on: push
name: build-lint-test
jobs:
  fmt:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # rust-toolchain installs with `--profile minimal`, so rustfmt is not
      # there unless asked for.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Nothing is compiled here, so this job needs no cargo cache -- which also
      # makes it the first job to report, and a formatting failure never waits
      # on a build.
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Run Clippy Lints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry, index and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry, index and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --all-targets --all-features

  build:
    name: Build ${{ matrix.platform.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x64
          - name: Linux
            runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            artifact_name: lessi-linux-x86_64

          # Linux ARM64
          - name: Linux
            runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            artifact_name: lessi-linux-aarch64

          # macOS x64 (Intel)
          - name: macOS
            runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
            artifact_name: lessi-macos-x86_64

          # macOS ARM64 (Apple Silicon)
          - name: macOS
            runner: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
            artifact_name: lessi-macos-aarch64

          # Windows x64
          - name: Windows
            runner: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            artifact_name: lessi-windows-x86_64.exe

          # Windows ARM64
          - name: Windows
            runner: windows-latest
            arch: aarch64
            target: aarch64-pc-windows-msvc
            artifact_name: lessi-windows-aarch64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo registry, index and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache keys on the job id and rustc host, neither of which
          # separates two targets cross-compiled on the same runner.
          key: ${{ matrix.platform.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.platform.target }} --bin lessi

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.platform.target }}/release/lessi artifacts/${{ matrix.platform.artifact_name }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir artifacts
          cp target/${{ matrix.platform.target }}/release/lessi.exe artifacts/${{ matrix.platform.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: artifacts/${{ matrix.platform.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    # A tag that fails formatting, lints or tests is not released.
    needs: [fmt, clippy, tests, build]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # Full history, so the `branch` check below can tell whether the tagged
      # commit is contained in main.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lessi-*
          merge-multiple: true
          path: release

      # Strips the tag's `v` prefix, pulls the matching `## [X.Y.Z]` section
      # out of CHANGELOG.md (via parse-changelog) and posts it as the release
      # body; a tag without a CHANGELOG entry fails here instead of shipping
      # empty notes. cargo-release pushes the tag, which triggers this workflow.
      - name: Create GitHub release with changelog notes
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          # Refuse tags pointing at commits that never landed on main.
          branch: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            release/*
